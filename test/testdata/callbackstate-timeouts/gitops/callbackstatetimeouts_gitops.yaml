# GitOps-profile variant of callbackstatetimeouts used in upgrade tests.
# The image tag is resolved at deploy time from --tests.upgrade.from_version
# or --tests.upgrade.to_version via the ${UPGRADE_GITOPS_IMAGE_VERSION}
# placeholder, which the step implementation replaces before applying.
#
# Pre-upgrade:  deployed with from-version tag (e.g. 1.38.1), then deleted.
# Post-upgrade: redeployed with to-version tag  (e.g. 1.39.0).
#
# Using a different tag between the two deploys ensures the cluster pulls the
# rebuilt image rather than reusing the cached one (imagePullPolicy: IfNotPresent).
apiVersion: sonataflow.org/v1alpha08
kind: SonataFlow
metadata:
  name: callbackstatetimeouts
  annotations:
    sonataflow.org/description: Callback State Timeouts Example k8s
    sonataflow.org/version: 1.0.0
    sonataflow.org/profile: gitops
spec:
  podTemplate:
    container:
      # Placeholder replaced by the BDD step before oc apply.
      image: quay.io/dhanak/callbackstatetimeouts:${UPGRADE_GITOPS_IMAGE_VERSION}
  flow:
    start: PrintStartMessage
    events:
      - name: callbackEvent
        source: ''
        type: callback_event_type
    functions:
      - name: systemOut
        type: custom
        operation: sysout
    states:
      - name: PrintStartMessage
        type: operation
        actions:
          - name: printSystemOut
            functionRef:
              refName: systemOut
              arguments:
                message: "${\"callback-state-timeouts: \" + $WORKFLOW.instanceId + \" has started.\"}"
        transition: CallbackState
      - name: CallbackState
        type: callback
        action:
          name: callbackAction
          functionRef:
            refName: systemOut
            arguments:
              message: "${\"callback-state-timeouts: \" + $WORKFLOW.instanceId + \" has executed the callbackFunction.\"}"
        eventRef: callbackEvent
        transition: CheckEventArrival
        timeouts:
          eventTimeout: PT30S
      - name: CheckEventArrival
        type: switch
        dataConditions:
          - condition: "${ .eventData != null }"
            transition: EventArrived
        defaultCondition:
          transition: EventNotArrived
      - name: EventArrived
        type: inject
        data:
          exitMessage: "The callback event has arrived."
        transition: PrintExitMessage
      - name: EventNotArrived
        type: inject
        data:
          exitMessage: "The callback event has not arrived, and the timeout has overdue."
        transition: PrintExitMessage
      - name: PrintExitMessage
        type: operation
        actions:
          - name: printSystemOut
            functionRef:
              refName: systemOut
              arguments:
                message: "${\"callback-state-timeouts: \" + $WORKFLOW.instanceId + \" has finalized. \" + .exitMessage + \" eventData: \" + .eventData}"
        end: true
